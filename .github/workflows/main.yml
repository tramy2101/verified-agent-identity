name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'The name of the agent (e.g., your username)'
        required: true
        default: 'KaZin'
      agent_description:
        description: 'A brief description of the agent (e.g., its purpose)'
        required: true
        default: 'finder AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Cài đặt Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Bước 1 - Cài đặt ClawHub
        run: npx clawhub@latest install verified-agent-identity --force --no-input

      - name: Cài đặt các thư viện cần thiết
        run: |
          cd skills/verified-agent-identity/scripts
          npm install @0xpolygonid/js-sdk shell-quote @iden3/js-iden3-auth

      - name: Bước 2 - Tạo Ethereum Identity mới
        run: |
          cd skills/verified-agent-identity/scripts
          node createNewEthereumIdentity.js

      - name: Bước 3 - Xem link xác minh Agent
        run: |
          cd skills/verified-agent-identity/scripts
          node manualLinkHumanToAgent.js --challenge "{\"name\": \"KaZin\", \"description\": \"${{ inputs.agent_description }}\"}"
